<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Clever | Log in</title>
  <link rel="icon" type="image/png" href="https://thegamewebsite.github.io/logo.png?v=13">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body,html{min-height:100%;background:#0a0a0f;font-family:'Inter',sans-serif;color:#fff;overflow-x:hidden;}
    body::before{
      content:'';position:fixed;inset:0;
      background:
        radial-gradient(ellipse 50% 50% at 10% 10%,rgba(255,83,112,0.12) 0%,transparent 60%),
        radial-gradient(ellipse 50% 40% at 90% 90%,rgba(79,195,247,0.1) 0%,transparent 60%);
      pointer-events:none;z-index:0;
    }

    .master-wrapper{
      position:relative;z-index:1;
      display:flex;flex-direction:column;align-items:center;
      min-height:100vh;padding:32px 20px 48px;
    }

    .header-nav{
      width:100%;max-width:920px;
      display:flex;justify-content:space-between;align-items:center;
      margin-bottom:40px;
    }

    .back-home-link{
      text-decoration:none;color:#fff;font-weight:700;font-size:11px;
      text-transform:uppercase;letter-spacing:2px;
      padding:9px 20px;border:1px solid rgba(255,255,255,0.2);
      border-radius:50px;transition:0.2s;
      background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);
    }
    .back-home-link:hover{background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.4);}

    .main-header{
      font-size:clamp(36px,6vw,64px);font-weight:900;
      letter-spacing:10px;text-transform:uppercase;text-align:center;
      color:#fff;margin-bottom:6px;
    }
    .main-header span{opacity:0.25;}

    .header-container{
      display:flex;flex-direction:column;align-items:center;gap:0;margin-bottom:48px;
    }
    .tagline{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,0.25);margin-bottom:28px;}

    /* Scramjet hero box */
    .scramjet-box{
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.12);
      border-top:2px solid #FF5370;
      padding:28px 64px;border-radius:20px;text-align:center;
      cursor:pointer;transition:0.25s cubic-bezier(.34,1.56,.64,1);
      backdrop-filter:blur(16px);
      box-shadow:0 0 60px rgba(255,83,112,0.1),inset 0 1px 0 rgba(255,255,255,0.08);
    }
    .scramjet-box:hover{transform:scale(1.04);box-shadow:0 0 80px rgba(255,83,112,0.2),inset 0 1px 0 rgba(255,255,255,0.1);}

    .scramjet-title{font-size:clamp(28px,4vw,44px);font-weight:900;letter-spacing:6px;text-transform:uppercase;color:#fff;}

    .status-container{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;}
    .status-light{width:8px;height:8px;border-radius:50%;background:#333;transition:0.4s;}
    .status-online{background:#00e676!important;box-shadow:0 0 10px #00e676;}
    .status-idle{background:#ffab00!important;box-shadow:0 0 10px #ffab00;}
    .status-offline{background:#FF5370!important;box-shadow:0 0 10px #FF5370;}
    .status-text{font-size:9px;color:rgba(255,255,255,0.3);letter-spacing:2px;text-transform:uppercase;}

    /* Grid */
    .section-label{
      font-size:10px;letter-spacing:3px;text-transform:uppercase;
      color:rgba(255,255,255,0.25);margin-bottom:16px;text-align:center;
      width:100%;
    }
    .dashboard-grid{display:flex;justify-content:center;gap:16px;width:100%;flex-wrap:wrap;}

    .column{
      display:flex;flex-direction:column;gap:10px;width:260px;
      padding:24px;border-radius:18px;
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.08);
      backdrop-filter:blur(12px);
      text-align:center;
    }
    .col-title{
      font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
      margin-bottom:4px;
    }
    .col-rh .col-title{color:#4FC3F7;}
    .col-utopia .col-title{color:rgba(255,255,255,0.4);}
    .col-doge .col-title{color:#FFB74D;}

    .col-divider{height:1px;background:rgba(255,255,255,0.07);margin:4px 0;}

    .btn{
      padding:11px;font-weight:700;font-size:11px;letter-spacing:1.5px;
      border-radius:10px;cursor:pointer;transition:0.2s;text-transform:uppercase;
      border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.07);color:#fff;
    }
    .col-rh .btn{border-color:rgba(79,195,247,0.25);}
    .col-rh .btn:hover{background:rgba(79,195,247,0.15);border-color:rgba(79,195,247,0.5);}
    .col-utopia .btn:hover{background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.25);}
    .col-doge .btn{border-color:rgba(255,183,77,0.25);}
    .col-doge .btn:hover{background:rgba(255,183,77,0.15);border-color:rgba(255,183,77,0.5);}
  </style>
</head>
<body>
  <div class="master-wrapper">
    <div class="header-nav">
      <a href="https://realhome-9d8.pages.dev" class="back-home-link">← Home</a>
    </div>

    <div class="header-container">
      <h1 class="main-header">Proxy <span>/</span> Links</h1>
      <p class="tagline">Select a proxy to launch</p>

      <div class="scramjet-box" onclick="launch('Scramjet','https://doxy-frontend.onrender.com/')">
        <h2 class="scramjet-title">Scramjet</h2>
        <div class="status-container">
          <div id="scramjet-light" class="status-light"></div>
          <span id="scramjet-status-text" class="status-text">Detecting server…</span>
        </div>
      </div>
    </div>

    <p class="section-label">Additional Proxies</p>
    <div class="dashboard-grid">
      <div class="column col-rh">
        <div class="col-title">Rammerhead</div>
        <div class="col-divider"></div>
        <button class="btn" onclick="launch('Rammerhead 1','https://shorturl.at/xYJ2i')">Method 1</button>
      </div>
      <div class="column col-utopia">
        <div class="col-title">Utopia</div>
        <div class="col-divider"></div>
        <button class="btn" onclick="launch('Utopia 2','https://food.fit-tw.com/')">Method 1</button>
      </div>
      <div class="column col-doge">
        <div class="col-title">Doge</div>
        <div class="col-divider"></div>
        <button class="btn" onclick="launch('Doge 1','https://educationate.space.cdn.cloudflare.net/')">Method 1</button>
        <button class="btn" onclick="launch('Doge 1','https://educationate.storage.googleapis.com/index.html#/')">Method 2</button>
      </div>
    </div>
  </div>

  <script>
    const RENDER_URL='https://superdupereducational.onrender.com/';
    async function checkStatus(){
      const light=document.getElementById('scramjet-light');
      const text=document.getElementById('scramjet-status-text');
      try{
        await fetch(RENDER_URL,{mode:'no-cors'});
        light.className='status-light status-online';text.innerText='Online — Ready';
      }catch(e){light.className='status-light status-offline';text.innerText='Offline';}
    }
    checkStatus();

    function launch(name,url){
      const content=`<!DOCTYPE html><html><head><title>${name} | Clever</title><style>body,html{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:#000;font-family:sans-serif;}iframe{border:none;width:100%;height:100%;}.back-btn{position:fixed;top:15px;left:15px;padding:8px 16px;background:rgba(0,0,0,0.6);color:white;border:1px solid rgba(255,255,255,0.3);border-radius:20px;cursor:pointer;z-index:99999;font-weight:bold;text-decoration:none;backdrop-filter:blur(5px);font-size:13px;transition:0.2s;}.back-btn:hover{background:#fff;color:#000;}<\/style><\/head><body><a href="https://proxies-6x8.pages.dev" class="back-btn">←<\/a><iframe src="${url}"><\/iframe><script>window.addEventListener('keydown',function(e){if(e.key.toLowerCase()==='q')window.location.replace('https://classroom.google.com');});<\/script><\/body><\/html>`;
      document.open();document.write(content);document.close();
    }
    window.addEventListener('keydown',function(e){if(e.key.toLowerCase()==='q')window.location.href='https://classroom.google.com';});
  </script>
</body>
</html>
